{% load static i18n %}
<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <title></title>
</head>

<body style="
      font-family: 'Public Sans', sans-serif !important;
      background: #f6f7f8;
      font-size: 14px;
      line-height: 1.6;
      color: #3c4852;
      padding: 10px 0 0 0;
      margin: 0px;
    ">
  <table align="center" style="vertical-align: top; width: 680px; background: #f6f7f8" cellspacing="0" cellpadding="0">
    <tr>
      <td width="15px" height="100%"></td>
      <td width="650px">
        <table align="center" style="width: 100%; background: #f6f7f8" cellpadding="0" cellspacing="0">
          <tr>
            <td width="100%" height="15px"></td>
          </tr>
          <tr>
            <td align="center">
              <a href="">
                <img style="width: 300px" src="{{ host }}{% static 'images/logo_main_with_tagline.png' %}" />
              </a>
            </td>
          </tr>
          <tr>
            <td width="100%" height="15px"></td>
          </tr>
        </table>

        <table align="center" style="width: 100%; background: #fff" cellpadding="40" cellspacing="0">
          <tr>
            <td width="100%" align="center">
              <table width="100%" cellspacing="0" cellpadding="0">
                
                <tr>
                  <td width="100%" height="20px"></td>
                </tr>
                <tr>
                  <td style="
                        color: #394955;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 18px;
                        font-weight: normal;
                      ">
                    Hello <strong>{{user.name}}</strong>
                  </td>
                </tr>
                <tr>
                  <td width="100%" height="10px"></td>
                </tr>
                <tr>
                  <td style="
                        color: #394955;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 16px;
                        font-weight: normal;
                      ">
                    Please click <a href="{{reset_url}}">here</a> to reset your password.
                    
                  </td>
                </tr>
                <tr>
                    
                </tr>
                <tr>
                  <td width="100%" height="30px"></td>
                </tr>
                <tr>
                  <td width="100%" height="1px" style="background:#D5D5D5"></td>
                </tr>
                <tr>
                  <td width="100%" height="30px"></td>
                </tr>
                <tr>
                  <td style="
                        color: #2C2C2C;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 16px;
                        font-weight: normal;
                      ">
                    Any questions or need any help? Please contact us at <span
                      style="color:#b8db22;">info@connectco.com</span>
                  </td>
                </tr>
                <tr>
                  <td width="100%" height="10px"></td>
                </tr>
                <tr>
                  <td style="
                        color: #2C2C2C;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 16px;
                        font-weight: normal;
                      ">
                    Thank you,
                  </td>
                </tr>
                <tr>
                  <td style="
                        color: #2C2C2C;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 16px;
                        font-weight: normal;
                      ">
                    Team ConnectCo
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <table align="center" style="vertical-align: top; width: 100%; background: #f6f7f8" cellspacing="0"
          cellpadding="0">
          <tr>
            <td width="100%" height="30px"></td>
          </tr>
        </table>
        <table align="center" style="width: 100%;" cellpadding="0" cellspacing="0">
          <tr>
            <td width="100%" align="center">
              <table width="100%" cellspacing="0" cellpadding="0">
                <tr>
                  <td width="100%" height="30px" colspan="2"></td>
                </tr>
               
                <tr>
                  <td width="100%" colspan="2" height="10px"></td>
                </tr>
                <tr>
                  <td colspan="2" style="
                        color: #808080;
                        text-align: center;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 12px;
                        font-weight: 300;
                      ">
                      © 2022 ConnectCo. All rights reserved.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <table align="center" style="vertical-align: top; width: 100%; background: #f6f7f8" cellspacing="0"
          cellpadding="0">
          <tr>
            <td width="100%" height="30px"></td>
          </tr>
        </table>
      </td>
      <td width="15px" height="100%"></td>
    </tr>
  </table>
</body>

</html>
